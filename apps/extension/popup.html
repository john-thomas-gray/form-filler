<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Form Filler</title>
    <style>
      :root {
        color-scheme: light;
        font-family:
          Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont,
          "Segoe UI", sans-serif;
      }

      * {
        box-sizing: border-box;
      }

      body {
        width: 240px;
        margin: 0;
        background: #2563eb;
        color: #ffffff;
      }

      main {
        display: grid;
        gap: 14px;
        padding: 16px;
      }

      h1 {
        margin: 0;
        font-size: 16px;
        font-weight: 700;
      }

      .toggle-row {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 16px;
        min-height: 44px;
        font-size: 14px;
        font-weight: 600;
      }

      #auto-fill {
        position: relative;
        flex: 0 0 auto;
        width: 42px;
        height: 24px;
        margin: 0;
        appearance: none;
        border: 1px solid #c6ccd8;
        border-radius: 999px;
        background: #d9dee7;
        cursor: pointer;
        transition:
          background 140ms ease,
          border-color 140ms ease;
      }

      #auto-fill::after {
        position: absolute;
        top: 2px;
        left: 2px;
        width: 18px;
        height: 18px;
        border-radius: 50%;
        background: #ffffff;
        box-shadow: 0 1px 3px rgb(23 31 45 / 24%);
        content: "";
        transition: transform 140ms ease;
      }

      #auto-fill:checked {
        border-color: #1d6f5b;
        background: #20866d;
      }

      #auto-fill:checked::after {
        transform: translateX(18px);
      }

      #auto-fill:focus-visible,
      #fill:focus-visible {
        outline: 2px solid #2f6feb;
        outline-offset: 3px;
      }

      #fill {
        min-height: 38px;
        border: 0;
        border-radius: 6px;
        background: #1f2937;
        color: #ffffff;
        font: inherit;
        font-size: 14px;
        font-weight: 700;
        cursor: pointer;
      }

      #fill:hover {
        background: #111827;
      }
    </style>
  </head>
  <body data-build-color="blue">
    <main>
      <h1>Form Filler</h1>
      <label class="toggle-row" for="auto-fill">
        <span>Auto-fill</span>
        <input id="auto-fill" type="checkbox" role="switch" />
      </label>
      <button id="fill" type="button">Fill now</button>
    </main>
    <script src="dist/popup.js"></script>
  </body>
</html>
